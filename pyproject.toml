[project]
name = "factor-research-workspace"
version = "0.1.0"
description = "Bounded local factor research, editable model graphs, offline policy replay and forecast observation."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0+cu128",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "pyqlib==0.9.7",
  "mlflow==3.12.0",
  "filelock>=3.16,<3.30",
  "plotly>=5,<7",
  "pyarrow>=18,<24",
  "duckdb>=1.3,<2",
  "optuna==4.9.0",
  "backtesting==0.6.6",
  "cvxpy==1.7.3",
  "lightgbm==4.6.0",
  "numba==0.61.2",
  "matplotlib>=3.9,<3.11",
  "jupyterlab>=4.4,<5",
  "ipykernel>=6.29,<8",
  "requests>=2.32,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
